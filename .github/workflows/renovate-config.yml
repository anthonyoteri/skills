name: Renovate config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://ghcr.io/renovatebot/renovate@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e # 44.198.2
        with:
          entrypoint: renovate-config-validator
          args: --strict
